<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحق الآن - جامعة المنيا</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 15px;
            background-color: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="text-center fw-bold mb-4">نموذج التقديم للالتحاق بالجامعة</h2>
            <p class="text-center mb-5 text-muted">يرجى ملء البيانات التالية بدقة للتقديم</p>

            <form action="/submit" method="POST">
                <div class="mb-3">
                    <label for="fullName" class="form-label">الاسم الكامل</label>
                    <input type="text" class="form-control" id="fullName" name="fullName" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">رقم الهاتف</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required>
                </div>
                <div class="mb-3">
                    <label for="faculty" class="form-label">الكلية <h1></h1></label>
                    <select class="form-select" id="faculty" name="faculty" required>
                        <option selected disabled value="">اختر كلية...</option>
                                                <option value="الحاسبات والمعلومات">كلية الحاسبات والمعلومات</option>

                        <option value="الطب">كلية الطب</option>
                        <option value="الهندسة">كلية الهندسة</option>
                        <option value="الصيدلة">كلية الصيدلة</option>
                        <option value="العلوم">كلية العلوم</option>
                        </select>
                </div>
                
                <div class="d-grid gap-2">
                    <button   type="submit" class="send-req">إرسال الطلب</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>**
